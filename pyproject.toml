[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-floater"
version = "0.1.0"
description = "Windows-first multi-league live-score desktop overlay (glass ticker + optional float pills)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NawfalHadi" }]
dependencies = [
  "Pillow>=10.0.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
packaging = ["pyinstaller>=6.0"]

[project.scripts]
football-floater = "football_floater.app:run"

[tool.setuptools.packages.find]
include = ["football_floater*"]
